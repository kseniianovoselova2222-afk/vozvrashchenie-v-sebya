<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Число души · Ксения Новосёлова</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1e1712">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
:root{--bg:#1e1712;--line:rgba(236,226,214,.18);--fg:#efe6db;--muted:#bba893;--accent:#d7b98f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Golos Text",system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.5}
.wrap{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{padding-block:34px 18px;display:grid;gap:12px}
.eb{font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-weight:400;text-transform:uppercase;letter-spacing:.1em;font-size:26px;line-height:1.2}
.lead{margin:0;color:var(--muted);font-size:15px}
.list{display:grid;gap:10px;padding-block:6px 40px}
.btn{display:block;text-align:center;text-decoration:none;padding:15px 18px;border-radius:12px;border:1.5px solid var(--accent);color:var(--accent);font-size:16px}
.btn:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
</style>
</head>
<body>
<header class="wrap">
<div class="eb">Ксения Новосёлова · кундалини-йога</div>
<h1>Число души</h1>
<p class="lead">Нажми на своё число и прочитай разбор: дар, ловушка, мантра и медитация</p>
</header>
<main class="wrap list">
<a class="btn" href="1/">1 · Творец</a>
<a class="btn" href="2/">2 · Чувствительность</a>
<a class="btn" href="3/">3 · Щедрость</a>
<a class="btn" href="4/">4 · Нейтральность</a>
<a class="btn" href="5/">5 · Учитель</a>
<a class="btn" href="6/">6 · Сердце</a>
<a class="btn" href="7/">7 · Аура</a>
<a class="btn" href="8/">8 · Сила</a>
<a class="btn" href="9/">9 · Терпение</a>
<a class="btn" href="10/">10 · Царственность</a>
<a class="btn" href="11/">11 · Мастер</a>
</main>
</body>
</html>
